[pipeasio]
; --- DDJ-FLX10 channel layout -------------------------------------------
; PipeASIO defaults to 2 in / 2 out, which cannot serve the FLX10's layout:
; VirtualDJ wants master on OUT 1&2 and headphones on OUT 3&4. The FLX10's
; PipeWire sink is 4ch (analog-surround-40), its source 10ch. Native Windows
; reports "4o/10i", so match that exactly.
outputs = 4
inputs = 10

; --- Auto-connect straight to the controller ----------------------------
; Without these, PipeASIO follows the PipeWire *default* sink/source, which
; here is the laptop's built-in audio, not the FLX10.
auto_connect = 1
output_device = alsa_output.usb-AlphaTheta_Corporation_DDJ-FLX10_CHMP009098EH-00.analog-surround-40
input_device = alsa_input.usb-AlphaTheta_Corporation_DDJ-FLX10_CHMP009098EH-00.multichannel-input

; --- Latency ------------------------------------------------------------
; 256 frames @ 44.1k = 5.8ms, which matches the 5ms native Windows reports.
; PipeASIO defaults to 1024 frames, or 23ms. Raise this to 512 (11.6ms) if
; you get audio dropouts -- it must stay a power of two.
buffer_size = 256
sample_rate = 44100
